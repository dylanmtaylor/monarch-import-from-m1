[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "monarch-import-from-m1"
version = "0.1.0"
description = "Extract all M1 Finance account activities, trades, dividends, and full daily balance histories into Monarch Money CSVs with automated browser capture."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Dylan M. Taylor", email = "dylan@dylanmtaylor.com" }
]
keywords = [
    "monarch",
    "monarch-money",
    "m1",
    "m1-finance",
    "investing",
    "brokerage",
    "ira",
    "roth-ira",
    "crypto",
    "balance-history",
    "daily-balances",
    "transactions",
    "dividends",
    "trades",
    "net-worth",
    "finance",
    "csv",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "websocket-client>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
m1-to-monarch = "m1_to_monarch.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["m1_to_monarch*"]
